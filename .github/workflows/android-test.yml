name: Android Instrumented Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feat/**'
      - 'codex/**'
    # 只有碰到向量索引/原生库/数据库/依赖时才值得起模拟器，
    # 改个 UI 或文案没必要烧十几分钟
    paths:
      - 'app/src/main/java/me/rerere/rikkahub/data/index/**'
      - 'app/src/main/java/me/rerere/rikkahub/data/db/**'
      - 'app/src/androidTest/**'
      - 'app/build.gradle.kts'
      - 'gradle/libs.versions.toml'
      - 'gradle/**'
      - '.github/workflows/android-test.yml'
  pull_request:
    paths:
      - 'app/src/main/java/me/rerere/rikkahub/data/index/**'
      - 'app/src/main/java/me/rerere/rikkahub/data/db/**'
      - 'app/src/androidTest/**'
      - 'app/build.gradle.kts'
      - 'gradle/libs.versions.toml'
      - 'gradle/**'
      - '.github/workflows/android-test.yml'

concurrency:
  group: android-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instrumented:
    name: 仪器测试（${{ matrix.name }}）
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # 常规 4KB 页设备
          - name: API 34 / x86_64
            api-level: 34
            target: google_apis
            abi: x86_64
            profile: ''
          # 16KB 页设备：Android 15+ 的页大小变更会直接让 4KB 对齐的原生库加载失败
          - name: API 36 / x86_64 / 16KB 页
            api-level: 36
            target: google_apis_ps16k
            abi: x86_64
            profile: ''
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'jetbrains'
          java-version: '21'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: 构建 Debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleGithubDebug --stacktrace

      - name: 检查 APK 内原生库页对齐
        run: |
          set -euo pipefail
          # 16KB 页设备要求每个 LOAD 段 p_align == 0x4000，未对齐的 .so 会直接加载失败
          APK=$(ls app/build/outputs/apk/github/debug/*.apk | head -1)
          echo "检查 $APK"
          rm -rf /tmp/so-check && mkdir -p /tmp/so-check
          unzip -o -q "$APK" 'lib/*/*.so' -d /tmp/so-check
          BAD=0
          while IFS= read -r so; do
            ALIGN=$(readelf -lW "$so" | awk '/LOAD/{print $NF}' | sort -u | tr '\n' ' ')
            echo "$so -> $ALIGN"
            case "$ALIGN" in
              *0x4000*) ;;
              *) echo "  !! 未按 16KB 页对齐"; BAD=1 ;;
            esac
          done < <(find /tmp/so-check -name '*.so' | sort)
          if [ "$BAD" = "1" ]; then
            echo "存在未按 16KB 页对齐的原生库" >&2
            exit 1
          fi

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # 按包跑，不列具体类名：以前这里是硬编码的两三个类，新加的测试（数据库迁移、备份恢复等）
      # 不加进列表就永远不跑，等于白写。现在按包发现，新增测试自动纳入。
      - name: 运行仪器测试
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.abi }}
          # 16KB 页镜像需要较新的系统镜像与较新的模拟器
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            chmod +x gradlew
            # androidTest 里的类一共 13 个，以前 CI 只跑硬编码的两个，其余从没跑过。
            # 这里逐个包跑，一个包失败后面继续，最后统一汇总，免得一个包的问题遮住其他包。
            failed=""
            for pkg in \
              me.rerere.rikkahub.data.db \
              me.rerere.rikkahub.data.db.dao \
              me.rerere.rikkahub.data.db.fts \
              me.rerere.rikkahub.data.db.migrations \
              me.rerere.rikkahub.data.index \
              me.rerere.rikkahub.data.sync \
              me.rerere.rikkahub.data.repository; do
              echo "===== $pkg ====="
              ./gradlew :app:connectedGithubDebugAndroidTest \
                -Pandroid.testInstrumentationRunnerArguments.package=$pkg \
                --stacktrace || failed="$failed $pkg"
            done
            # 留给重跑步骤：只重试这些包，不用把全量再跑一遍
            echo "$failed" | tr ' ' '\n' | sed '/^$/d' > /tmp/failed-packages.txt
            if [ -n "$failed" ]; then
              echo "失败的包:$failed" >&2
              exit 1
            fi

      # 模拟器会偶发崩在图形层（日志里是 Failed to bind to texture / invalid color buffer，
      # 外加一串 adb 退出码 1），测试连用例都没跑到就整任务失败。这和被测代码无关。
      # 只重跑真正失败的包；真有问题的话第二次照样失败，不会掩盖。
      - name: 失败的包重跑一次
        if: failure()
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.abi }}
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            chmod +x gradlew
            if [ ! -s /tmp/failed-packages.txt ]; then
              echo "没有记录到失败的包，说明是模拟器本身没起来，重跑全量"
              echo "me.rerere.rikkahub.data" > /tmp/failed-packages.txt
            fi
            failed=""
            while IFS= read -r pkg; do
              echo "===== 重跑 $pkg ====="
              ./gradlew :app:connectedGithubDebugAndroidTest \
                -Pandroid.testInstrumentationRunnerArguments.package=$pkg \
                --stacktrace || failed="$failed $pkg"
            done < /tmp/failed-packages.txt
            if [ -n "$failed" ]; then
              echo "重跑仍然失败:$failed" >&2
              exit 1
            fi

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-${{ matrix.api-level }}-${{ github.sha }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
