name: Spotless Apply

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    name: 自动格式化并提交
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'jetbrains'
          java-version: '21'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: 准备 spotless 基线
        run: |
          if ! git rev-parse --verify --quiet refs/remotes/origin/master >/dev/null; then
            git update-ref refs/remotes/origin/master "$(git rev-parse origin/main)"
            echo "created refs/remotes/origin/master -> origin/main"
          fi

      - name: spotlessApply
        run: |
          chmod +x gradlew
          ./gradlew spotlessApply --stacktrace

      - name: 提交格式化结果
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "没有需要格式化的文件"
            exit 0
          fi
          git config user.name "spotless-bot"
          git config user.email "spotless-bot@users.noreply.github.com"
          git add -A
          git commit -m "style: spotlessApply 自动格式化"
          git push
