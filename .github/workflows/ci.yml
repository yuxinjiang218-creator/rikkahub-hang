name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feat/**'
      - 'codex/**'
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-test:
    name: 单元测试
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # spotless 的 ratchetFrom 需要 origin/master，story 历史也要完整
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'jetbrains'
          java-version: '21'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: 单元测试（app 模块）
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --stacktrace

      # Room 的 schema 是提交进仓库的；构建时才生成，所以让 CI 顺手补上，
      # 免得每次改表结构都得在本地跑一遍编译。
      - name: 提交生成的 Room schema
        if: always() && github.event_name == 'push'
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain app/schemas)" ]; then
            echo "schema 没有变化"
            exit 0
          fi
          git --no-pager diff --stat app/schemas
          git config user.name "room-schema-bot"
          git config user.email "room-schema-bot@users.noreply.github.com"
          git add app/schemas
          git commit -m "chore(db): 提交生成的 Room schema"
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "schema 已提交"
              exit 0
            fi
            echo "推送失败，第 $attempt 次重试前先同步远端"
            sleep $((attempt * 5))
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          done
          echo "多次重试后仍无法推送 schema" >&2
          exit 0

      - name: 上传测试报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports-${{ github.sha }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: warn

  format:
    name: 格式检查
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'jetbrains'
          java-version: '21'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: 准备 spotless 基线
        run: |
          # 上游仓库的默认分支叫 master，本仓库叫 main；spotless 的 ratchetFrom
          # 指向 origin/master，这里在缺失时补一个指向 main 的等效引用
          if ! git rev-parse --verify --quiet refs/remotes/origin/master >/dev/null; then
            git update-ref refs/remotes/origin/master "$(git rev-parse origin/main)"
            echo "created refs/remotes/origin/master -> origin/main"
          fi

      # 本仓库要求不在本机构建，格式差异交给 CI 直接修好并提交；
      # 用 GITHUB_TOKEN 推送不会再触发工作流，所以不会打转。
      - name: spotlessApply 并提交
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew spotlessApply --stacktrace
          if [ -z "$(git status --porcelain)" ]; then
            echo "格式已符合要求"
            exit 0
          fi
          git --no-pager diff --stat
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "非 push 事件不做自动提交，请本地跑 spotlessApply" >&2
            exit 1
          fi
          git config user.name "spotless-bot"
          git config user.email "spotless-bot@users.noreply.github.com"
          git add -A
          git commit -m "style: spotlessApply 自动格式化"
          git push

      - name: spotless 检查
        run: |
          chmod +x gradlew
          ./gradlew spotlessCheck --stacktrace
